[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-carbon"
version = "0.1.0"
description = "Predictive carbon-aware software engineering static analysis foundation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Code-Carbon Research Team" }]
dependencies = [
    "PyYAML>=6.0",
    "radon>=6.0",
    "psutil>=7.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.api.main:app"